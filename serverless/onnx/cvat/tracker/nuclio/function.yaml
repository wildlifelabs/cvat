metadata:
  name: onnx-cvat-tracker
  namespace: cvat
  annotations:
    name: YOLO v7 Tracker
    type: tracker
    spec: |
      [
        { "id": 23, "name": "giraffe", "type": "rectangle" }
      ]
spec:
  description: Giraffe tracker
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  logLevel: debug
  build:
    image: cvat.onnx.cvat.tracker
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        - kind: RUN
          value: apt-get update && apt-get install --no-install-recommends -y wget python3-pip python-is-python3 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: pip install jsonpickle onnxruntime opencv-python-headless pillow pyyaml numpy --no-cache-dir
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: wget https://github.com/WongKinYiu/yolov7/releases/download/v0.1/yolov7-w6-nms-1280.onnx

  triggers:
    myHttpTrigger:
      numWorkers: 8
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume